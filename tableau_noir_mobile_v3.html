<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#050505"><title>Tableau noir infini</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:white;font:14px -apple-system,BlinkMacSystemFont,system-ui}button,input{font:inherit}button{border:0;color:white;background:#282828;border-radius:10px;padding:11px;touch-action:manipulation}button.active{background:#3564a9}#board{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#050505;z-index:1}#toolbar{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:8px;right:48px;display:flex;gap:5px;overflow:auto;scrollbar-width:none}#toolbar button{white-space:nowrap;min-width:40px}#handle{position:fixed;z-index:10;right:0;top:0;height:100%;width:40px;background:#222;display:flex;align-items:center;justify-content:center;border-left:1px solid #444;border-radius:0;padding:0}#handle span{font-size:25px;color:#ddd;transform:rotate(90deg)}#panel{position:fixed;z-index:9;right:40px;top:0;bottom:0;width:min(310px,calc(100vw - 40px));background:#191919;border-left:1px solid #555;padding:calc(24px + env(safe-area-inset-top)) 14px 20px;overflow:auto;display:none;box-shadow:-12px 0 30px #0009}#panel.open{display:block}#panel input{width:100%;background:#303030;border:1px solid #555;border-radius:8px;padding:12px;color:white;margin:5px 0 10px}#panel button{margin:3px}#files button{display:block;width:100%;text-align:left}#status{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));pointer-events:none;background:#171717bb;border-radius:8px;padding:7px 9px;color:#aaa;font-size:12px}h2{font-size:18px}small{color:#aaa}</style></head><body><canvas id="board"></canvas><div id="toolbar"><button id="pen" class="active">✎ Stylo</button><button id="pan">✋ Déplacer</button><button id="eraser">⌫ Gomme</button><button id="undo">↶</button><button id="redo">↷</button><button id="zoomIn">＋</button><button id="zoomOut">－</button><button id="color">⚪</button></div><button id="handle" aria-label="Ouvrir les fichiers"><span>☰</span></button><aside id="panel"><h2>Mes tableaux</h2><small>Enregistrement local sur cet appareil</small><label>Nom du tableau<input id="name" value="Nouveau tableau"></label><label>Dossier<input id="folder" value="Général"></label><button id="save">💾 Sauvegarder</button><button id="new">＋ Nouveau</button><button id="export">⇩ Exporter</button><label style="display:block;margin-top:12px">Importer un tableau JSON<input id="import" type="file" accept=".json,application/json"></label><h2>Fichiers enregistrés</h2><div id="files"></div><small>Pour synchroniser entre appareils, un hébergement et un compte cloud seront nécessaires.</small></aside><div id="status">Stylo · 100 %</div><script>
(()=>{'use strict';const c=document.getElementById('board'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let strokes=[],redo=[],mode='pen',color='#fff',scale=1,ox=0,oy=0,active=new Map(),draft=null,gesture=null,panStart=null,dirty=false;const colors=['#ffffff','#ffda44','#ff5454','#50aaff','#61d48b'];function size(){const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,3);c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);render()}function screen(p){return{x:(p.x-ox)/scale,y:(p.y-oy)/scale}}function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function render(){const d=Math.min(devicePixelRatio||1,3);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ctx.translate(ox,oy);ctx.scale(scale,scale);for(const s of [...strokes,...(draft?[draft]:[])]){if(!s.points?.length)continue;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);if(s.points.length===1){ctx.arc(s.points[0].x,s.points[0].y,s.width/2,0,Math.PI*2);ctx.fill()}else{for(const p of s.points.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke()}}$('status').textContent=(mode==='pen'?'Stylo':mode==='pan'?'Déplacer':'Gomme')+' · '+Math.round(scale*100)+' %'+(dirty?' · non sauvegardé':'')}
function setMode(m){mode=m;for(const id of ['pen','pan','eraser'])$(id).classList.toggle('active',id===m);render()}function zoom(f,at={x:innerWidth/2,y:innerHeight/2}){const before=screen(at);scale=Math.max(.12,Math.min(8,scale*f));ox=at.x-before.x*scale;oy=at.y-before.y*scale;render()}function start(e){e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch{}const p=pos(e);active.set(e.pointerId,p);if(active.size===2){draft=null;const v=[...active.values()];gesture={dist:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mid:{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2},scale,ox,oy};return}if(active.size!==1)return;if(mode==='pan'){panStart={p,ox,oy};return}draft={color:mode==='eraser'?'#050505':color,width:mode==='eraser'?28:3,points:[screen(p)]};render()}function move(e){if(!active.has(e.pointerId))return;e.preventDefault();const p=pos(e);active.set(e.pointerId,p);if(active.size>=2){const v=[...active.values()],mid={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2},dist=Math.max(1,Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y));if(!gesture)return;const world={x:(gesture.mid.x-gesture.ox)/gesture.scale,y:(gesture.mid.y-gesture.oy)/gesture.scale};scale=Math.max(.12,Math.min(8,gesture.scale*dist/Math.max(1,gesture.dist)));ox=mid.x-world.x*scale;oy=mid.y-world.y*scale;render();return}if(mode==='pan'&&panStart){ox=panStart.ox+p.x-panStart.p.x;oy=panStart.oy+p.y-panStart.p.y;render()}else if(draft){draft.points.push(screen(p));render()}}function end(e){if(!active.has(e.pointerId))return;e.preventDefault();active.delete(e.pointerId);if(draft){strokes.push(draft);draft=null;redo=[];dirty=true}if(active.size<2)gesture=null;if(active.size===0)panStart=null;render()}c.addEventListener('pointerdown',start,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',end,{passive:false});c.addEventListener('pointercancel',end,{passive:false});c.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.002),pos(e))},{passive:false});['touchstart','touchmove'].forEach(t=>c.addEventListener(t,e=>e.preventDefault(),{passive:false}));$('pen').onclick=()=>setMode('pen');$('pan').onclick=()=>setMode('pan');$('eraser').onclick=()=>setMode('eraser');$('undo').onclick=()=>{if(strokes.length){redo.push(strokes.pop());dirty=true;render()}};$('redo').onclick=()=>{if(redo.length){strokes.push(redo.pop());dirty=true;render()}};$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);$('color').onclick=()=>{color=colors[(colors.indexOf(color)+1)%colors.length];$('color').textContent='●';$('color').style.color=color;setMode('pen')};$('handle').onclick=()=>{$('panel').classList.toggle('open')};const key='tableau-noir-v2';function getFiles(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return{}}}function refresh(){const fs=getFiles();$('files').replaceChildren();for(const [id,f] of Object.entries(fs)){const b=document.createElement('button');b.textContent='📁 '+f.folder+' / '+f.name;b.onclick=()=>{if(dirty&&!confirm('Abandonner les modifications non sauvegardées ?'))return;strokes=f.strokes||[];redo=[];scale=f.scale||1;ox=f.ox||0;oy=f.oy||0;$('name').value=f.name;$('folder').value=f.folder;dirty=false;$('panel').classList.remove('open');render()};$('files').append(b)}}function snapshot(){return{name:$('name').value.trim()||'Sans titre',folder:$('folder').value.trim()||'Général',strokes,scale,ox,oy}}$('save').onclick=()=>{try{const fs=getFiles(),f=snapshot(),id=f.folder+'/'+f.name;fs[id]=f;localStorage.setItem(key,JSON.stringify(fs));dirty=false;refresh();render();alert('Tableau sauvegardé sur cet appareil.')}catch(e){alert('Sauvegarde impossible dans ce navigateur : '+e.message)}};$('new').onclick=()=>{if(dirty&&!confirm('Abandonner les modifications non sauvegardées ?'))return;strokes=[];redo=[];scale=1;ox=0;oy=0;dirty=false;$('name').value='Nouveau tableau';$('panel').classList.remove('open');render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(snapshot())],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=($('name').value||'tableau').replace(/[^\wÀ-ÿ-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const f=JSON.parse(await file.text());if(!Array.isArray(f.strokes))throw Error('Format invalide');strokes=f.strokes;redo=[];scale=f.scale||1;ox=f.ox||0;oy=f.oy||0;$('name').value=f.name||'Importé';$('folder').value=f.folder||'Général';dirty=true;$('panel').classList.remove('open');render()}catch(err){alert('Import impossible : '+err.message)}};window.addEventListener('resize',size);size();refresh();})();
</script></body></html>
