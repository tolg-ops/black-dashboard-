<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tableau noir infini</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}#tools{position:fixed;top:10px;left:10px;right:56px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;z-index:2;background:#222e;padding:8px;border-radius:12px;max-width:max-content}button,input,select{font:inherit}button,select{background:#333;color:#eee;border:1px solid #555;border-radius:8px;padding:8px;cursor:pointer}button.active{background:#596b83}input[type=color]{width:36px;height:36px;padding:1px;background:transparent;border:0}input[type=range]{width:85px}#handle{position:fixed;right:0;top:0;height:100dvh;width:42px;background:#242424;display:grid;place-items:center;cursor:pointer;z-index:5;border-left:1px solid #444}#handle span{font-size:25px;color:#ddd;writing-mode:horizontal-tb}#panel{position:fixed;right:42px;top:0;height:100dvh;width:min(340px,calc(100vw - 42px));background:#202020;z-index:4;padding:20px;overflow:auto;box-shadow:-8px 0 24px #0008;transform:translateX(calc(100% + 50px));transition:transform .2s}#panel.open{transform:translateX(0)}#panel input[type=text]{width:100%;padding:10px;background:#111;color:white;border:1px solid #555;border-radius:7px;margin:6px 0}#panel button{margin:4px 2px}#files>div{padding:9px;background:#303030;margin:6px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:5px}#files button{padding:5px}small{color:#aaa}#status{position:fixed;bottom:12px;left:12px;background:#222c;padding:7px 10px;border-radius:8px;color:#ccc;pointer-events:none}h2{margin:8px 0 16px}hr{border:0;border-top:1px solid #444;margin:18px 0}</style></head><body><canvas id="board"></canvas><div id="tools"><button id="pen" class="active">✎ Stylo</button><button id="eraser">⌫ Gomme</button><button id="pan">✥ Déplacer</button><input type="color" id="color" value="#ffffff" title="Couleur"><label>Épaisseur <input id="width" type="range" min="1" max="24" value="3"></label><button id="undo">↶</button><button id="redo">↷</button><button id="zoomout">−</button><button id="zoomin">+</button><button id="reset">100 %</button><button id="save">☁ Sauvegarder</button></div><div id="handle" title="Ouvrir les fichiers"><span>☰</span></div><aside id="panel"><h2>Mes tableaux</h2><small>Sauvegardes sur cet appareil. Exportez un fichier pour le transférer.</small><hr><label>Dossier</label><select id="folder"></select><button id="newfolder">+ Dossier</button><hr><label>Nom du tableau</label><input id="name" type="text" value="Nouveau tableau"><button id="panelsave">Enregistrer</button><button id="newboard">+ Nouveau tableau</button><h3>Fichiers du dossier</h3><div id="files"></div><hr><button id="export">↓ Exporter JSON</button><button id="import">↑ Importer JSON</button><input id="upload" type="file" accept=".json,application/json" hidden><button id="png">↓ Image PNG</button><p><small>Astuce : mode Déplacer ou deux doigts pour naviguer. Pincez avec deux doigts pour zoomer.</small></p></aside><div id="status">100 % · Prêt à dessiner au doigt</div><script>
(()=>{'use strict';const c=document.querySelector('#board'),ctx=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,dpr,scale=1,ox=innerWidth/2,oy=innerHeight/2,strokes=[],redo=[],mode='pen',active=new Map(),gesture=null,working=null,dirty=false,currentId=null;const key='tableau-infini-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{folders:['Général','Mathématiques','Physique'],files:[]}}catch{db={folders:['Général'],files:[]}}let folder='Général';function persist(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('Stockage local saturé : exportez vos tableaux.');return false}}function resize(){dpr=Math.min(devicePixelRatio||1,3);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;draw()}function world(x,y){return{x:(x-ox)/scale,y:(y-oy)/scale}}function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);for(const s of [...strokes,...(working?[working]:[])]){let p=s.points;if(!p.length)continue;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';if(p.length===1){ctx.beginPath();ctx.arc(p[0].x,p[0].y,s.width/2,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.stroke()}}ctx.restore();$('#status').textContent=Math.round(scale*100)+' % · '+(dirty?'Modifications non sauvegardées':'Sauvegardé')}function mark(){dirty=true;draw()}function setmode(m){mode=m;for(const v of ['pen','eraser','pan'])$('#'+v).classList.toggle('active',v===m);c.style.cursor=m==='pan'?'grab':'crosshair'}function zoom(f,x=W/2,y=H/2){const ns=Math.max(.1,Math.min(8,scale*f)),k=ns/scale;ox=x-(x-ox)*k;oy=y-(y-oy)*k;scale=ns;draw()}function pxy(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function pointerdown(e){e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}active.set(e.pointerId,pxy(e));if(active.size===2){if(working){working=null;draw()}const p=[...active.values()];gesture={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mid:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}};return}if(mode!=='pan'){const p=world(pxy(e).x,pxy(e).y);working={color:mode==='eraser'?'#050505':$('#color').value,width:Number($('#width').value)/scale*(mode==='eraser'?5:1),points:[p]};draw()}}function pointermove(e){if(!active.has(e.pointerId))return;e.preventDefault();const old=active.get(e.pointerId),now=pxy(e);active.set(e.pointerId,now);if(active.size>=2){const p=[...active.values()],mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2},dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(gesture){ox+=mid.x-gesture.mid.x;oy+=mid.y-gesture.mid.y;zoom(dist/Math.max(1,gesture.distance),mid.x,mid.y)}gesture={mid,distance:dist};return}if(mode==='pan'){ox+=now.x-old.x;oy+=now.y-old.y;draw()}else if(working){working.points.push(world(now.x,now.y));draw()}}function pointerup(e){if(!active.has(e.pointerId))return;active.delete(e.pointerId);if(active.size<2)gesture=null;if(working){strokes.push(working);working=null;redo=[];mark()}}// Compatibilité tactile Safari et aperçus mobiles : chemin Touch Events indépendant.
let touchMode=false;
function touchEvent(t){return {pointerId:1000+t.identifier,clientX:t.clientX,clientY:t.clientY,preventDefault(){}}}
c.addEventListener('touchstart',e=>{touchMode=true;e.preventDefault();for(const t of e.changedTouches)pointerdown(touchEvent(t))},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)pointermove(touchEvent(t))},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)pointerup(touchEvent(t))},{passive:false});
c.addEventListener('touchcancel',e=>{e.preventDefault();for(const t of e.changedTouches)pointerup(touchEvent(t))},{passive:false});
c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&touchMode)return;pointerdown(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&touchMode)return;pointermove(e)});c.addEventListener('pointerup',e=>{if(e.pointerType==='touch'&&touchMode)return;pointerup(e)});c.addEventListener('pointercancel',e=>{if(e.pointerType==='touch'&&touchMode)return;pointerup(e)});c.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});['pen','eraser','pan'].forEach(m=>$('#'+m).onclick=()=>setmode(m));$('#undo').onclick=()=>{if(strokes.length){redo.push(strokes.pop());mark()}};$('#redo').onclick=()=>{if(redo.length){strokes.push(redo.pop());mark()}};$('#zoomin').onclick=()=>zoom(1.25);$('#zoomout').onclick=()=>zoom(.8);$('#reset').onclick=()=>{scale=1;ox=W/2;oy=H/2;draw()};$('#handle').onclick=()=>$('#panel').classList.toggle('open');function folders(){let s=$('#folder');s.innerHTML='';for(const f of db.folders){let o=document.createElement('option');o.value=f;o.textContent=f;s.append(o)}if(!db.folders.includes(folder))folder=db.folders[0];s.value=folder;files()}function files(){let el=$('#files');el.innerHTML='';for(const f of db.files.filter(f=>f.folder===folder).sort((a,b)=>b.updated-a.updated)){let row=document.createElement('div'),name=document.createElement('span'),open=document.createElement('button'),del=document.createElement('button');name.textContent=f.name;open.textContent='Ouvrir';del.textContent='×';open.onclick=()=>{if(dirty&&!confirm('Les modifications non sauvegardées seront perdues. Continuer ?'))return;currentId=f.id;strokes=structuredClone(f.strokes);redo=[];scale=f.scale||1;ox=W/2;oy=H/2;$('#name').value=f.name;dirty=false;draw();$('#panel').classList.remove('open')};del.onclick=()=>{if(confirm('Supprimer ce fichier ?')){db.files=db.files.filter(x=>x.id!==f.id);persist();files()}};row.append(name,open,del);el.append(row)}if(!el.children.length)el.textContent='Aucun tableau dans ce dossier.'}$('#folder').onchange=e=>{folder=e.target.value;files()};$('#newfolder').onclick=()=>{let f=prompt('Nom du nouveau dossier :');if(f&&f.trim()&&!db.folders.includes(f.trim())){db.folders.push(f.trim());folder=f.trim();persist();folders()}};function save(){let name=$('#name').value.trim()||'Sans titre',file=db.files.find(f=>f.id===currentId);if(!file){file={id:Date.now()+'-'+Math.random().toString(36).slice(2),folder};db.files.push(file);currentId=file.id}Object.assign(file,{name,folder,strokes:structuredClone(strokes),scale,updated:Date.now()});if(persist()){dirty=false;draw();files()}}$('#save').onclick=save;$('#panelsave').onclick=save;$('#newboard').onclick=()=>{if(dirty&&!confirm('Créer un nouveau tableau sans sauvegarder les modifications ?'))return;currentId=null;strokes=[];redo=[];scale=1;ox=W/2;oy=H/2;$('#name').value='Nouveau tableau';dirty=false;draw();$('#panel').classList.remove('open')};$('#export').onclick=()=>{const data=JSON.stringify({version:1,name:$('#name').value,strokes,scale},null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=($('#name').value||'tableau').replace(/[^\w\-À-ÿ ]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('#import').onclick=()=>$('#upload').click();$('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.strokes)||!data.strokes.every(s=>Array.isArray(s.points)&&typeof s.color==='string'&&typeof s.width==='number'))throw Error('Format invalide');if(dirty&&!confirm('Remplacer les modifications non sauvegardées ?'))return;strokes=data.strokes;redo=[];currentId=null;$('#name').value=data.name||f.name.replace(/\.json$/,'');scale=1;ox=W/2;oy=H/2;mark();$('#panel').classList.remove('open')}catch(err){alert('Impossible d’importer : '+err.message)}e.target.value=''};$('#png').onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='tableau.png';a.click()};addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('#undo').click()}});addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});addEventListener('resize',resize);folders();resize()})();
</script></body></html>
